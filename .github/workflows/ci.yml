name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        run: npm ci
      - name: Run comparison engine tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Exercise production app and accessibility
        run: npm run test:e2e
      - name: Install Python CLI
        run: python -m pip install -e ./python
      - name: Run Python tests against shared fixtures
        run: python -m unittest discover -s python/tests -v
      - name: Build Python wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build python --outdir package-dist
          python -m twine check package-dist/*
      - name: Verify installed wheel public API
        run: |
          python -m venv /tmp/prooflane-wheel
          /tmp/prooflane-wheel/bin/pip install package-dist/*.whl
          cd /tmp
          /tmp/prooflane-wheel/bin/python -c "import numpy as np; from prooflane import compare; a=np.zeros((2,2,3), dtype=np.uint8); assert compare(a,a).changedPixels == 0"
      - name: Save Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: package-dist/*
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Prepare Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4
